[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-tracker"
version = "0.2.0"
description = "Bulk-create Salesforce PS Tasks from your weekly meetings. Replays the Lightning Flow via your own browser session. 5-min setup, 30-sec/week use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Internal — Taboola only" }
authors = [
    { name = "Govind Nath Singh", email = "govind-nath.s@taboola.com" },
]
keywords = ["salesforce", "automation", "lightning-flow", "calendar"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "click>=8.1.7",
    "requests>=2.32.0",
    "rich>=13.7.1",
    "python-dateutil>=2.9.0",
]

[project.scripts]
activity-tracker = "activity_tracker.cli:main"

[project.urls]
Source = "https://github.com/govindnathsng/non-ticketed-activity-tracker"

[tool.setuptools.packages.find]
where = ["."]
include = ["activity_tracker*"]
exclude = ["tests*", ".venv*"]

[tool.setuptools.package-data]
activity_tracker = ["py.typed"]
